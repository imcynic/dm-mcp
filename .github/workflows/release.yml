name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: dm-mcp.exe, archive: zip }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, bin: dm-mcp, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
            (cd dist && zip "dm-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}.zip" "${{ matrix.bin }}")
          else
            strip "target/${{ matrix.target }}/release/${{ matrix.bin }}"
            tar -czf "dist/dm-mcp-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
              -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
